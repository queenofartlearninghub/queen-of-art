<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Log in | Queen of Art</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#3B1C78;--dark:#24104D;--lilac:#EEE6FF;--gold:#FFC93C;--rose:#FF5C8A;--ink:#1E1433}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--violet);
  color:var(--ink);
  line-height:1.55;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.brand{
  font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  font-weight:800;
  font-size:1.8rem;
  letter-spacing:-.02em;
  color:#fff;
  text-decoration:none;
  margin-bottom:32px;
}
.card{
  max-width:460px;
  width:100%;
  margin:0 auto;
  background:#fff;
  border-radius:26px;
  padding:34px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}
h1{
  font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  font-size:1.8rem;
  letter-spacing:-.02em;
  color:var(--violet);
  margin-bottom:6px;
}
.sub{
  color:#6a5a8c;
  font-size:.93rem;
  margin-bottom:24px;
}
label{
  display:block;
  font-weight:700;
  font-size:.92rem;
  margin:16px 0 5px;
}
input{
  width:100%;
  padding:14px 16px;
  border:2px solid var(--lilac);
  border-radius:12px;
  font:inherit;
  font-size:1rem;
  outline:none;
  transition:border .2s;
}
input:focus{
  border-color:var(--violet);
}
.btn{
  display:block;
  width:100%;
  margin-top:24px;
  padding:14px 20px;
  border-radius:999px;
  border:0;
  background:var(--gold);
  color:var(--dark);
  font:inherit;
  font-weight:700;
  font-size:1rem;
  cursor:pointer;
  transition:opacity .2s;
}
.btn:hover{
  opacity:.9;
}
.btn:disabled{
  opacity:.6;
  cursor:wait;
}
.link{
  background:none;
  border:0;
  color:var(--violet);
  font:inherit;
  font-weight:500;
  text-decoration:underline;
  cursor:pointer;
  margin-top:16px;
  padding:0;
  text-align:center;
  width:100%;
}
.link:hover{
  color:var(--dark);
}
.back-link{
  display:block;
  text-align:center;
  margin-top:24px;
  color:#6a5a8c;
  text-decoration:none;
  font-size:.9rem;
}
.back-link:hover{
  color:var(--violet);
}
.msg{
  margin-top:16px;
  padding:12px 14px;
  border-radius:12px;
  font-size:.93rem;
  display:none;
}
.msg.err{
  display:block;
  background:#ffe3ea;
  color:#8a1236;
}
.msg.ok{
  display:block;
  background:#e3f7e8;
  color:#145a2a;
}
:focus-visible{
  outline:3px solid var(--rose);
  outline-offset:2px;
}
</style>
</head>
<body>

<a class="brand" href="index.html">Queen of Art</a>

<main class="card">
  <h1>Admin Log in</h1>
  <p class="sub">Secure access — only for authorized administrators.</p>

  <label for="email">Admin Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Enter your admin email">

  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Enter your password">

  <button class="btn" type="button" id="go">Log in</button>
  <button class="link" type="button" id="forgot">Forgot your password?</button>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <a class="back-link" href="register.html">← Back to role selection</a>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBRdhNInntNmDUKyGCsSNNKbdYmIWyh5ts",
  authDomain: "queen-of-art.firebaseapp.com",
  projectId: "queen-of-art",
  storageBucket: "queen-of-art.firebasestorage.app",
  messagingSenderId: "681441268668",
  appId: "1:681441268668:web:ef7e01b245bb96995291b9"
});
const auth = firebase.auth();
const $ = id => document.getElementById(id);
const say = (t, ok) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); };

const ALLOWED_ADMIN_EMAILS = ['almirabagro12@gmail.com'];

const explain = e => ({
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/wrong-password': 'Wrong email or password.',
  'auth/user-not-found': 'No account with that email.',
  'auth/invalid-email': 'That email address does not look right.',
  'auth/too-many-requests': 'Too many tries. Wait a few minutes and try again.',
  'auth/network-request-failed': 'No internet connection. Try again.'
})[e && e.code] || ('Something went wrong' + (e && e.code ? ' (' + e.code + ')' : '') + '. Try again.');

async function submit() {
  const email = $('email').value.trim(), pass = $('pass').value;
  if (!email || !pass) return say('Enter your email and password.');

  if (!ALLOWED_ADMIN_EMAILS.includes(email.toLowerCase())) {
    return say('This page is for administrators only. Your email is not authorized.');
  }

  $('go').disabled = true;
  $('go').textContent = 'Signing in...';

  try {
    await auth.signInWithEmailAndPassword(email, pass);
    say('Sign in successful! Redirecting...', true);
    setTimeout(() => {
      location.href = 'admin-dashboard.html';
    }, 800);
  } catch (e) {
    say(explain(e));
    $('go').disabled = false;
    $('go').textContent = 'Log in';
  }
}
$('go').onclick = submit;
$('pass').onkeydown = e => { if (e.key === 'Enter') submit(); };

$('forgot').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) return say('Type your email above first, then click this again.');
  try {
    await auth.sendPasswordResetEmail(email);
    say('Password reset email sent. Check your inbox and spam folder.', true);
  } catch (e) { say(explain(e)); }
};
</script>

</body>
</html>
