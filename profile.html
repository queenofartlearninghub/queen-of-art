<script>
  // Firebase init — keep your existing config
  const firebaseConfig = {
    apiKey: "AIzaSyBRdhNInntNmDUKyGCsSNNKbdYmIWyh5ts",
    authDomain: "queen-of-art.firebaseapp.com",
    projectId: "queen-of-art",
    storageBucket: "queen-of-art.firebasestorage.app",
    messagingSenderId: "681441268668",
    appId: "1:681441268668:web:ef7e01b245bb96995291b9"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // === GET & DISPLAY USER NAME ===
  async function updateUserDisplay(user) {
    const nameEl = document.querySelector(".user-name");
    const emailEl = document.querySelector(".user-email");
    const avatarEl = document.querySelector(".avatar-letter");

    if (!user) {
      if (nameEl) nameEl.textContent = "Student login";
      if (emailEl) emailEl.textContent = "";
      if (avatarEl) avatarEl.textContent = "S";
      return;
    }

    // Try to get full name — priority: Firestore → Auth displayName → email prefix
    let displayName = user.displayName;

    if (!displayName) {
      try {
        const docRef = db.collection("users").doc(user.email.toLowerCase());
        const docSnap = await docRef.get();
        if (docSnap.exists() && docSnap.data().fullName) {
          displayName = docSnap.data().fullName;
        }
      } catch (e) {
        console.log("No profile in Firestore yet");
      }
    }

    if (!displayName) {
      displayName = user.email.split("@")[0];
    }

    // Update display
    if (nameEl) nameEl.textContent = displayName;
    if (emailEl) emailEl.textContent = user.email;
    if (avatarEl) avatarEl.textContent = displayName.charAt(0).toUpperCase();
  }

  // === LOGOUT — FIXED: auto-redirect, no message ===
  async function handleLogout() {
    try {
      await firebase.auth().signOut();
      window.location.href = "index.html"; // goes straight home
    } catch (err) {
      console.error("Logout error:", err);
      alert("Logout failed: " + err.message);
    }
  }

  // === WATCH AUTH STATE ===
  firebase.auth().onAuthStateChanged((user) => {
    updateUserDisplay(user);
  });

  // Attach logout button
  document.addEventListener("click", (e) => {
    if (e.target.closest('[data-action="logout"]') || e.target.textContent.trim() === "Log out") {
      e.preventDefault();
      handleLogout();
    }
  });
</script>
