<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queen of Art | Select Role</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#3B1C78;
  --violet-dark:#24104D;
  --lilac:#EEE6FF;
  --ink:#1E1433;
  --white:#fff;
  --head:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--body);
  background:var(--violet-dark);
  color:var(--white);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.top-bar{
  background:rgba(0,0,0,.25);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.top-bar .logo{
  font-family:var(--head);
  font-weight:800;
  font-size:1.3rem;
  color:inherit;
  text-decoration:none;
}
.top-bar .login-label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:.95rem;
  opacity:.8
}
.top-bar .avatar-s{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#B89600;
  color:var(--white);
  display:grid;
  place-items:center;
  font-weight:700;
}
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
}
.card{
  background:var(--white);
  color:var(--ink);
  border-radius:24px;
  padding:44px 32px;
  max-width:520px;
  width:100%;
  text-align:center;
  box-shadow:0 22px 50px rgba(0,0,0,.35);
}
h1{
  font-family:var(--head);
  font-size:1.9rem;
  margin-bottom:10px;
  color:var(--violet);
}
.sub{
  color:#6a5a8c;
  margin-bottom:36px;
}
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:28px;
}
.choice{
  border:2px solid var(--lilac);
  border-radius:16px;
  padding:28px 16px;
  cursor:pointer;
  transition:all .2s;
  background:transparent;
}
.choice:hover{
  border-color:var(--violet);
  background:var(--lilac);
}
.choice .icon{
  font-size:1.5rem;
  margin-bottom:8px;
}
.choice h2{
  font-family:var(--head);
  font-size:1.1rem;
  margin-bottom:4px;
}
.choice p{
  font-size:.88rem;
  color:#6a5a8c;
  line-height:1.4;
}
.cancel{
  color:#6a5a8c;
  font-size:.9rem;
  text-decoration:none;
  display:inline-block;
  margin-top:8px;
}
.cancel:hover{
  color:var(--violet);
  text-decoration:underline;
}

@media(max-width:480px){
  .choices{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="top-bar">
  <a class="logo" href="index.html">Queen of Art</a>
  
</div>

<main>
  <div class="card">
    <h1>Welcome Back</h1>
    <p class="sub">Select your role to continue</p>
    <div class="choices">
      <button class="choice" id="studentBtn">
        <div class="icon">🎓</div>
        <h2>Student</h2>
        <p>Log in to your courses</p>
      </button>
      <button class="choice" id="adminBtn">
        <div class="icon">👑</div>
        <h2>Admin</h2>
        <p>Manage accounts & content</p>
      </button>
    </div>
    <a class="cancel" href="index.html">Cancel — continue browsing</a>
  </div>
</main>

<script>
document.getElementById('studentBtn').addEventListener('click', () => {
  window.location.href = 'login.html';
});
document.getElementById('adminBtn').addEventListener('click', () => {
  window.location.href = 'admin.html';
});
</script>

</body>
</html>
