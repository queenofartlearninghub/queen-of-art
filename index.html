<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Queen of Art</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#3B1C78;--dark:#24104D;--lilac:#EEE6FF;--gold:#FFC93C;--rose:#FF5C8A;--ink:#1E1433}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--violet);color:var(--ink);min-height:100vh}

.avatar-letter{background:var(--gold);color:var(--dark);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:700}
.user-name{font-weight:700}
.user-email{font-size:.85rem;color:#666}
.hide{display:none}
</style>
</head>
<body>

<!-- YOUR NAVIGATION / PAGE CONTENT STARTS HERE — keep your existing HTML -->
<!-- Example navigation structure: -->
<nav style="background:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center">
  <div class="brand" style="font-family:'Bricolage Grotesque';font-weight:800;font-size:1.4rem;color:var(--violet)">Queen of Art</div>
  
  <div style="display:flex;align-items:center;gap:12px">
    <div class="avatar-letter">A</div>
    <div>
      <div class="user-name">Loading…</div>
      <div class="user-email"></div>
    </div>
    <div style="position:relative">
      <button id="userMenuToggle" style="background:none;border:none;cursor:pointer">▼</button>
      <div id="userDropdown" style="display:none;position:absolute;right:0;top:100%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);border-radius:8px;min-width:160px;z-index:99">
        <a href="profile.html" style="display:block;padding:10px 14px;text-decoration:none;color:inherit">My Profile</a>
        <a href="#" data-action="logout" style="display:block;padding:10px 14px;text-decoration:none;color:inherit">Log out</a>
      </div>
    </div>
  </div>
</nav>

<!-- Firebase SDKs — keep these 3 lines in this order -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
const firebaseConfig = {
  apiKey: "AIzaSyBRdhNInntNmDUKyGCsSNNKbdYmIWyh5ts",
  authDomain: "queen-of-art.firebaseapp.com",
  projectId: "queen-of-art",
  storageBucket: "queen-of-art.firebasestorage.app",
  messagingSenderId: "681441268668",
  appId: "1:681441268668:web:ef7e01b245bb96995291b9"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

async function getDisplayName(user) {
  let displayName = user.displayName;

  // Try email-based doc first (preferred pattern)
  if (!displayName) {
    try {
      const emailDoc = await db.collection("users").doc(user.email.toLowerCase()).get();
      if (emailDoc.exists && emailDoc.data().fullName) {
        displayName = emailDoc.data().fullName;
      }
    } catch (e) {
      console.log("Email doc lookup skipped");
    }
  }

  // Fallback: try UID-based doc during transition
  if (!displayName) {
    try {
      const uidDoc = await db.collection("users").doc(user.uid).get();
      if (uidDoc.exists && uidDoc.data().fullName) {
        displayName = uidDoc.data().fullName;
      }
    } catch (e) {
      console.log("UID doc lookup skipped");
    }
  }

  // Final fallback: email prefix
  if (!displayName) {
    displayName = user.email.split("@")[0];
  }

  return displayName;
}

async function updateUserUI(user) {
  const nameEl = document.querySelector(".user-name");
  const emailEl = document.querySelector(".user-email");
  const avatarEl = document.querySelector(".avatar-letter");

  if (!user) {
    if (nameEl) nameEl.textContent = "Student login";
    if (emailEl) emailEl.textContent = "";
    if (avatarEl) avatarEl.textContent = "S";
    return;
  }

  const displayName = await getDisplayName(user);

  if (nameEl) nameEl.textContent = displayName;
  if (emailEl) emailEl.textContent = user.email;
  if (avatarEl) avatarEl.textContent = displayName.charAt(0).toUpperCase();
}

async function handleLogout() {
  try {
    await firebase.auth().signOut();
    window.location.href = "index.html";
  } catch (err) {
    console.error("Logout error:", err);
    alert("Logout failed: " + err.message);
  }
}

// Dropdown toggle
const menuToggle = document.getElementById("userMenuToggle");
const dropdown = document.getElementById("userDropdown");
if (menuToggle && dropdown) {
  menuToggle.addEventListener("click", () => {
    dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
  });
}

// Logout handler — NO ALERTS, direct redirect ✅
document.addEventListener("click", (e) => {
  const targetText = e.target.textContent.trim();
  if (e.target.closest('[data-action="logout"]') || targetText === "Log out") {
    e.preventDefault();
    handleLogout();
  }
});

// Auth state watcher
firebase.auth().onAuthStateChanged((user) => {
  updateUserUI(user);
});
</script>
</body>
</html>
