<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queen of Art</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#3B1C78;--dark:#24104D;--lilac:#EEE6FF;--gold:#FFC93C;--rose:#FF5C8A;--ink:#1E1433}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--violet);color:var(--ink);line-height:1.5}

/* Navigation — Clean, NO login button ✅ */
nav{background:#fff;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif;font-weight:800;font-size:1.5rem;color:var(--violet);text-decoration:none}
.user-area{display:flex;align-items:center;gap:12px;position:relative}
.avatar-letter{background:var(--gold);color:var(--dark);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.user-info{line-height:1.2}
.user-name{font-weight:700;font-size:.95rem}
.user-email{font-size:.8rem;color:#777}
.menu-btn{background:none;border:none;cursor:pointer;padding:4px 8px;font-size:.8rem;color:var(--violet)}
.dropdown{position:absolute;right:0;top:100%;margin-top:8px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:12px;min-width:180px;display:none;overflow:hidden}
.dropdown a{display:block;padding:12px 18px;text-decoration:none;color:var(--ink)}
.dropdown a:hover{background:var(--lilac)}

/* Login Selection — Center Screen ✅ */
.login-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:200;padding:24px}
.login-card{background:#fff;border-radius:24px;padding:40px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card h2{font-family:'Bricolage Grotesque',sans-serif;font-size:1.8rem;color:var(--violet);margin-bottom:8px}
.login-card p{color:#666;margin-bottom:32px}
.role-buttons{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.role-btn{padding:28px 20px;border:2px solid var(--lilac);border-radius:16px;background:#fff;cursor:pointer;transition:.2s;font-size:1.1rem;font-weight:700;color:var(--violet)}
.role-btn:hover{border-color:var(--gold);background:var(--lilac);transform:translateY(-2px)}
.role-btn .sub{font-weight:400;font-size:.85rem;color:#777;margin-top:6px}
.close-btn{margin-top:24px;background:none;border:none;color:#888;cursor:pointer;text-decoration:underline}

/* Your homepage content — fully visible ✅ */
main{padding:40px 32px}

/* Trigger link to open login — place where you want */
.open-login-btn{display:inline-block;margin-top:20px;padding:14px 32px;background:var(--gold);color:var(--dark);font-weight:700;border-radius:999px;text-decoration:none;border:none;cursor:pointer;font-size:1rem}

.hide{display:none !important}
</style>
</head>
<body>

<!-- Navigation — Only Brand + Logged-in Menu ✅ -->
<nav>
  <a href="index.html" class="brand">Queen of Art</a>
  
  <!-- TOP "Student login" BUTTON REMOVED ✅ -->
  <div class="user-area" id="loggedInArea" style="display:none">
    <div class="avatar-letter" id="avatarLetter">A</div>
    <div class="user-info">
      <div class="user-name" id="userName"></div>
      <div class="user-email" id="userEmail"></div>
    </div>
    <button class="menu-btn" id="menuToggle">▼</button>
    
    <div class="dropdown" id="userMenu">
      <a href="profile.html">My Profile</a>
      <a href="#" data-action="logout">Log out</a>
    </div>
  </div>
</nav>

<!-- ============================================== -->
<!-- YOUR EXISTING HOMEPAGE CONTENT — EVERYONE SEES IT ✅ -->
<main>
  <!-- Paste ALL your original homepage content here -->
  
  <!-- Optional: Add login button anywhere on your page -->
  <!-- <button class="open-login-btn" id="openLoginBtn">Log In / Sign In</button> -->
</main>
<!-- ============================================== -->

<!-- Login Selection — Center Screen ✅ -->
<div class="login-modal" id="loginModal">
  <div class="login-card">
    <h2>Welcome Back</h2>
    <p>Select your role to continue</p>
    
    <div class="role-buttons">
      <button class="role-btn" id="studentBtn">
        🎓 Student
        <div class="sub">Log in to your courses</div>
      </button>
      <button class="role-btn" id="adminBtn">
        👑 Admin
        <div class="sub">Manage accounts & content</div>
      </button>
    </div>
    
    <button class="close-btn" id="closeModal">Cancel — continue browsing</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBRdhNInntNmDUKyGCsSNNKbdYmIWyh5ts",
  authDomain: "queen-of-art.firebaseapp.com",
  projectId: "queen-of-art",
  storageBucket: "queen-of-art.firebasestorage.app",
  messagingSenderId: "681441268668",
  appId: "1:681441268668:web:ef7e01b245bb96995291b9"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_EMAIL = "almirabagro12@gmail.com";

async function getDisplayName(user) {
  let displayName = user.displayName;
  if (!displayName) {
    try {
      const snap = await db.collection("users").doc(user.email.toLowerCase()).get();
      if (snap.exists && snap.data().fullName) displayName = snap.data().fullName;
    } catch (e) {}
  }
  if (!displayName) {
    try {
      const snap = await db.collection("users").doc(user.uid).get();
      if (snap.exists && snap.data().fullName) displayName = snap.data().fullName;
    } catch (e) {}
  }
  if (!displayName) displayName = user.email.split("@")[0];
  return displayName;
}

async function updateUI(user) {
  const loggedInArea = document.getElementById("loggedInArea");
  const avatar = document.getElementById("avatarLetter");
  const nameEl = document.getElementById("userName");
  const emailEl = document.getElementById("userEmail");
  const loginModal = document.getElementById("loginModal");

  if (!user) {
    loggedInArea.style.display = "none";
    loginModal.style.display = "grid"; // Modal shows by default ✅
    return;
  }

  // Hide modal, show user info when logged in ✅
  loginModal.style.display = "none";
  loggedInArea.style.display = "flex";
  const displayName = await getDisplayName(user);
  avatar.textContent = displayName.charAt(0).toUpperCase();
  nameEl.textContent = displayName;
  emailEl.textContent = user.email;
}

async function handleLogout(e) {
  e.preventDefault();
  try {
    await firebase.auth().signOut();
    window.location.href = "index.html";
  } catch (err) { console.error(err); }
}

// Close modal — continue browsing
document.getElementById("closeModal").addEventListener("click", () => {
  document.getElementById("loginModal").style.display = "none";
});

// Student → login only
document.getElementById("studentBtn").addEventListener("click", () => {
  window.location.href = "register.html?role=student";
});

// Admin → login + registration
document.getElementById("adminBtn").addEventListener("click", () => {
  window.location.href = "register.html?role=admin";
});

// Menu toggle
document.getElementById("menuToggle").addEventListener("click", () => {
  const menu = document.getElementById("userMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".user-area")) {
    document.getElementById("userMenu").style.display = "none";
  }
});

// Logout
document.addEventListener("click", (e) => {
  if (e.target.closest('[data-action="logout"]')) handleLogout(e);
});

firebase.auth().onAuthStateChanged(updateUI);
</script>
</body>
</html>
