<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub | Queen of Art</title>
  <!-- ✅ Canonical Tag -->
  <link rel="canonical" href="https://queen-of-art.elearninghub.workers.dev/courses">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "Queen of Art Courses",
  "description": "All graphic design and Canva courses in one place.",
  "url": "https://queen-of-art.elearninghub.workers.dev/courses",
  "itemListElement": [
    {
      "@type": "Course",
      "position": 1,
      "name": "Beginner Graphic Design",
      "description": "Start your creative journey with Canva basics.",
      "provider": {
        "@type": "Organization",
        "name": "Queen of Art"
      },
      "offers": {
        "@type": "Offer",
        "price": "99",
        "priceCurrency": "PHP"
      }
    },
    {
      "@type": "Course",
      "position": 2,
      "name": "Intermediate Design",
      "description": "Level up your design skills with advanced Canva techniques.",
      "provider": {
        "@type": "Organization",
        "name": "Queen of Art"
      },
      "offers": {
        "@type": "Offer",
        "price": "199",
        "priceCurrency": "PHP"
      }
    },
    {
      "@type": "Course",
      "position": 3,
      "name": "Advanced & Certification",
      "description": "Master professional design workflows and earn certification.",
      "provider": {
        "@type": "Organization",
        "name": "Queen of Art"
      },
      "offers": {
        "@type": "Offer",
        "price": "499",
        "priceCurrency": "PHP"
      }
    }
  ]
}
</script>
</head>
<body>
<header id="top"></header>

<div class="hero2">
  <div class="wrap">
    <h1>Learning hub</h1>
    <p>All Queen of Art courses in one place. Log in to open the courses you have enrolled in.</p>
  </div>
</div>

<main class="wrap pad">
  <div class="search-wrap" style="margin-bottom:20px;">
    <input
      id="search"
      type="text"
      placeholder="Search courses..."
      style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px;"
    >
  </div>

  <div class="chips" id="filters"></div>
  <div class="cards" id="grid"></div>
  <p class="note hide" id="empty">No courses are published yet. Please check back soon.</p>
  <div class="msg err hide" id="err"></div>
</main>

<footer class="mini">
  <div class="wrap">
    &copy; 2026 Queen of Art Online Learning Courses &nbsp;|&nbsp;
    <a href="index.html">Home</a>
    <a href="payment.html">Payment Terms</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</footer>

<!-- Order: Firebase first, then app.js, then page code -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>

<script>
(async () => {
  renderTopbar();
  const user = await authReady();
  let mine = [];
  if (user) {
    try {
      const s = await db.collection('users').doc(user.id || user.email).get();
      mine = (s.data() || {}).courses || [];
    } catch (e) {}
  }

  let list = [];
  try {
    const snap = await db.collection('catalog').where('published', '==', true).get();
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
  } catch (e) {
    $('err').textContent = 'Could not load the courses. Please try again later.';
    $('err').classList.remove('hide');
    return;
  }
  list.sort((a, b) => (a.order || 0) - (b.order || 0));
  if (!list.length) { $('empty').classList.remove('hide'); return; }

  const categories = [
    'All', 'Career Templates', 'Beginner ₱99', 'Intermediate ₱199',
    'Advanced ₱299', 'Certification ₱499', 'Premium ₱999'
  ];

  let activeCategory = 'All';
  let searchTerm = '';

  function draw() {
    $('filters').innerHTML = categories.map(cat => `
      <button type="button" class="${cat === activeCategory ? 'on' : ''}" data-cat="${cat}">
        ${cat}
      </button>
    `).join('');

    $('filters').querySelectorAll('button').forEach(btn => {
      btn.onclick = () => { activeCategory = btn.dataset.cat; draw(); };
    });

    const filtered = list.filter(course => {
      const matchesCategory = activeCategory === 'All' || course.category === activeCategory;
      const matchesSearch = !searchTerm ||
        (course.title || '').toLowerCase().includes(searchTerm) ||
        (course.summary || '').toLowerCase().includes(searchTerm);
      return matchesCategory && matchesSearch;
    });

    $('grid').innerHTML = filtered.map(c => {
      const enrolled = mine.includes(c.id);
      return `
        <article class="card">
          <div>
            <span class="tag">${esc(c.category || 'Learning Module')}</span>
            ${enrolled ? '<span class="tag ok">Enrolled</span>' : ''}
          </div>
          <h3>${esc(c.title)}</h3>
          <p>${esc(c.summary || '')}</p>
          ${c.price ? `<div class="price">${esc(c.price)}</div>` : ''}
          <a class="btn" href="course.html?id=${encodeURIComponent(c.id)}">
            ${enrolled ? 'Continue Learning' : 'View Course'}
          </a>
        </article>
      `;
    }).join('');
  }

  $('search').addEventListener('input', e => {
    searchTerm = e.target.value.toLowerCase();
    draw();
  });

  draw();
})();
</script>
</body>
</html>
