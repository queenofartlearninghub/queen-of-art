<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate | Queen of Art</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.cert{max-width:980px;margin:0 auto;background:#fff;border:14px solid var(--violet);outline:4px solid var(--gold);outline-offset:-26px;border-radius:6px;padding:56px 50px;text-align:center;aspect-ratio:1.414/1;display:flex;flex-direction:column;justify-content:center}
.cert .brand{font-family:var(--head);font-weight:800;color:var(--violet);font-size:1.5rem}
.cert h1{font-family:var(--head);font-size:clamp(1.6rem,4.2vw,2.8rem);color:var(--violet);margin:10px 0 18px}
.cert .skills{max-width:78%;margin:8px auto 0;font-size:1.05rem}
.cert .small{color:#5d4f7e}
.cert .name{font-family:var(--head);font-weight:800;font-size:clamp(1.8rem,5vw,3rem);color:var(--ink);margin:12px auto;padding:0 20px 8px;border-bottom:3px solid var(--gold);display:inline-block;max-width:100%;word-break:break-word}
.cert .course{font-family:var(--head);font-weight:800;font-size:clamp(1.2rem,3vw,1.9rem);color:var(--violet);margin:12px 0}
.cert .line{border-top:2px solid var(--ink);padding-top:6px;margin-top:6px;font-size:.9rem}
.cert .idline{margin-top:22px;font-size:.85rem;color:#5d4f7e;word-break:break-all}
.actions{max-width:980px;margin:0 auto 18px;display:flex;gap:12px;flex-wrap:wrap}
.cert{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert > *{position:relative;z-index:2}
.cert .wm{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='210'><text x='180' y='115' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-size='28' font-weight='700' fill='%233B1C78' fill-opacity='0.08' transform='rotate(-28 180 105)'>QUEEN OF ART</text></svg>")}
.cert .logo{display:flex;flex-direction:column;align-items:center;gap:2px}
.cert .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:18px}
.cert .fcol{flex:1;min-width:0;text-align:center}
.cert .fv,.cert .sigarea{height:62px;display:flex;align-items:flex-end;justify-content:center}
.cert .sig{max-height:60px;max-width:230px;object-fit:contain}
.cert .sigtext{display:none;font-family:'Great Vibes',cursive;font-size:2.1rem;color:var(--ink);line-height:1}
.cert .seal{flex:0 0 100px;margin-bottom:-6px}
.cert .seal svg{width:100px;height:auto;display:block}
.cert .idrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;text-align:left}
.cert #qr{width:76px;height:76px;background:#fff;flex:0 0 76px}
.cert .idrow .idline{margin-top:0;text-align:left}
@page{size:A4 landscape;margin:6mm}
@media print{
  #top,.hero2,.actions,footer.mini,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0!important;max-width:none!important}
  .cert{border-width:12px;width:100%;aspect-ratio:auto;height:192mm;padding:18px 40px;break-inside:avoid}
  .cert h1{margin:4px 0 8px}
}
</style>
</head>
<body>
<header id="top"></header>
<div class="hero2"><div class="wrap"><h1 id="pageTitle">Certificate</h1><p id="pageSub"></p></div></div>

<main class="wrap pad">
  <div class="note hide" id="msg"></div>
  <div class="actions hide" id="actions">
    <button class="btn" type="button" onclick="window.print()">Print or save as PDF</button>
    <a class="btn line" href="courses.html">Back to the Learning hub</a>
  </div>
  <div class="cert hide" id="cert"></div>
</main>

<footer class="mini"><div class="wrap">&copy; 2026 Queen of Art Online Learning Courses &nbsp;|&nbsp; <a href="courses.html">Learning hub</a><a href="privacy.html">Privacy Policy</a></div></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  renderTopbar();
  const params = new URLSearchParams(location.search);
  const SEAL = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 150\" width=\"110\" height=\"137\" role=\"img\" aria-label=\"Official seal of Queen of Art\">\n<defs>\n<linearGradient id=\"gd\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFE9A0\"/><stop offset=\".5\" stop-color=\"#FFC93C\"/><stop offset=\"1\" stop-color=\"#C58E00\"/></linearGradient>\n<linearGradient id=\"gd2\" x1=\"1\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFE9A0\"/><stop offset=\".55\" stop-color=\"#F2B705\"/><stop offset=\"1\" stop-color=\"#B98200\"/></linearGradient>\n<path id=\"arc\" d=\"M60,60 m-30,0 a30,30 0 1,1 60,0 a30,30 0 1,1 -60,0\"/>\n</defs>\n<path d=\"M36 92 L22 148 L44 136 L58 148 L66 98 Z\" fill=\"url(#gd2)\" stroke=\"#9A6F00\" stroke-width=\"1\"/>\n<path d=\"M84 92 L98 148 L76 136 L62 148 L54 98 Z\" fill=\"url(#gd)\" stroke=\"#9A6F00\" stroke-width=\"1\"/>\n<polygon points=\"113.0,60.0 106.8,64.6 112.0,70.3 105.0,73.6 109.0,80.3 101.5,82.2 104.1,89.4 96.3,89.8 97.5,97.5 89.8,96.3 89.4,104.1 82.2,101.5 80.3,109.0 73.6,105.0 70.3,112.0 64.6,106.8 60.0,113.0 55.4,106.8 49.7,112.0 46.4,105.0 39.7,109.0 37.8,101.5 30.6,104.1 30.2,96.3 22.5,97.5 23.7,89.8 15.9,89.4 18.5,82.2 11.0,80.3 15.0,73.6 8.0,70.3 13.2,64.6 7.0,60.0 13.2,55.4 8.0,49.7 15.0,46.4 11.0,39.7 18.5,37.8 15.9,30.6 23.7,30.2 22.5,22.5 30.2,23.7 30.6,15.9 37.8,18.5 39.7,11.0 46.4,15.0 49.7,8.0 55.4,13.2 60.0,7.0 64.6,13.2 70.3,8.0 73.6,15.0 80.3,11.0 82.2,18.5 89.4,15.9 89.8,23.7 97.5,22.5 96.3,30.2 104.1,30.6 101.5,37.8 109.0,39.7 105.0,46.4 112.0,49.7 106.8,55.4\" fill=\"url(#gd)\" stroke=\"#9A6F00\" stroke-width=\"1.2\"/>\n<circle cx=\"60\" cy=\"60\" r=\"40\" fill=\"none\" stroke=\"#9A6F00\" stroke-width=\"1.5\"/>\n<circle cx=\"60\" cy=\"60\" r=\"37\" fill=\"#FFF3C4\" stroke=\"#C58E00\" stroke-width=\"1\"/>\n<text font-family=\"Arial,Helvetica,sans-serif\" font-size=\"8.2\" font-weight=\"700\" fill=\"#3B1C78\" letter-spacing=\"1.6\"><textPath href=\"#arc\" startOffset=\"0\">QUEEN OF ART • ORIGINAL • OFFICIAL •</textPath></text>\n<path d=\"M44 66 L44 50 L52 57 L60 44 L68 57 L76 50 L76 66 Z\" fill=\"#3B1C78\"/>\n<rect x=\"44\" y=\"68\" width=\"32\" height=\"4\" rx=\"1\" fill=\"#3B1C78\"/>\n</svg>";
  const CROWN = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 76\" width=\"62\" height=\"39\" role=\"img\" aria-label=\"Queen of Art crown logo\">\n<defs><linearGradient id=\"gc\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFE9A0\"/><stop offset=\".5\" stop-color=\"#FFC93C\"/><stop offset=\"1\" stop-color=\"#C58E00\"/></linearGradient></defs>\n<path d=\"M10 62 L10 22 L36 42 L60 10 L84 42 L110 22 L110 62 Z\" fill=\"url(#gc)\" stroke=\"#3B1C78\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<rect x=\"10\" y=\"62\" width=\"100\" height=\"9\" rx=\"2\" fill=\"#3B1C78\"/>\n<circle cx=\"10\" cy=\"20\" r=\"6\" fill=\"#3B1C78\"/><circle cx=\"60\" cy=\"8\" r=\"6\" fill=\"#3B1C78\"/><circle cx=\"110\" cy=\"20\" r=\"6\" fill=\"#3B1C78\"/>\n</svg>";
  const note = t => { $('msg').innerHTML = t; $('msg').classList.remove('hide'); };

  function show(c, verified, meta) {
    meta = meta || {};
    const d = new Date(c.issued);
    const date = isNaN(d) ? '' : d.toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
    const link = location.origin + location.pathname + '?verify=' + encodeURIComponent(c.id);
    const title = meta.certTitle || 'Certificate of Completion';
    const what = meta.certTitle
      ? '<div class="small">has successfully completed the course requirements' + (meta.certText ? ' and can now:' : '') + '</div>' +
        (meta.certText ? '<div class="skills">' + esc(meta.certText) + '</div>' : '')
      : '<div class="small">has successfully completed the course and passed its quiz:</div><div class="course">' + esc(c.courseTitle) + '</div>';
    $('cert').innerHTML = `
      <div class="wm" aria-hidden="true"></div>
      <div class="logo">${CROWN}<div class="brand">Queen of Art</div><div class="small">Online Learning Courses</div></div>
      <h1>${esc(title)}</h1>
      <div class="small">This certifies that</div>
      <div><span class="name">${esc(c.name)}</span></div>
      ${what}
      <div class="foot">
        <div class="fcol"><div class="fv"><strong>${esc(date)}</strong></div><div class="line">Date issued</div></div>
        <div class="seal">${SEAL}</div>
        <div class="fcol"><div class="sigarea"><img class="sig" src="Signature.png" alt="Signature of Almira Cubol Bagro" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="sigtext">Almira Cubol Bagro</span></div><strong>Almira Cubol Bagro</strong><br>Founder &amp; Creative Director</div>
      </div>
      <div class="idrow"><div id="qr"></div><div class="idline">Certificate ID: <strong>${esc(c.id)}</strong><br>Scan the code or open this link to verify:<br>${esc(link)}</div></div>`;
    if (window.QRCode) new QRCode($('qr'), { text: link, width: 76, height: 76, colorDark: '#1E1433', colorLight: '#ffffff' });
    $('cert').classList.remove('hide'); $('actions').classList.remove('hide');
    if (verified) { $('pageTitle').textContent = 'Valid certificate'; $('pageSub').textContent = 'This certificate was issued by Queen of Art Online Learning Courses.'; $('actions').classList.add('hide'); }
    else { $('pageTitle').textContent = 'Your certificate'; $('pageSub').textContent = 'Congratulations! Print it or save it as a PDF.'; }
  }

  // Verification mode: anyone can check a certificate ID
  const vid = params.get('verify');
  if (vid) {
    try {
      const s = await db.collection('certificates').doc(vid).get();
      if (!s.exists) return note('No certificate was found with that ID. Please check the ID and try again.');
      const rec = { id: vid, ...s.data() };
      let meta = {};
      try { meta = (await db.collection('catalog').doc(rec.courseId).get()).data() || {}; } catch (e) {}
      return show(rec, true, meta);
    } catch (e) { return note('Could not check this certificate right now. Please try again later.'); }
  }

  // Issue mode
  const cid = params.get('id');
  if (!cid) return note('Open this page from your course after you pass every module quiz.');
  const user = await authReady();
  if (!user) return note('Please <a href="register.html">log in</a> to see your certificate.');

  let course;
  try { const s = await db.collection('catalog').doc(cid).get(); if (!s.exists) throw 0; course = s.data(); }
  catch (e) { return note('Course not found.'); }

  const quizzes = (course.outline || []).filter(i => i.type === 'quiz' || i.hasQuiz);
  const progRef = db.collection('users').doc(user.uid).collection('progress').doc(cid);
  let prog = {};
  try { prog = (await progRef.get()).data() || {}; } catch (e) { return note('Could not load your progress. Make sure you are enrolled in this course.'); }
  const passed = prog.passed || {};
  const complete = quizzes.length > 0 && quizzes.every(q => (passed[q.id] || 0) >= (q.passMark || 80));
  if (!complete) return note('Your certificate is not ready yet. Pass every module quiz first, then come back. <a href="course.html?id=' + encodeURIComponent(cid) + '">Back to the course</a>');

  try {
    if (prog.certId) {
      const s = await db.collection('certificates').doc(prog.certId).get();
      if (s.exists) return show({ id: prog.certId, ...s.data() }, false, course);
    }
    let name = '';
    try { name = ((await db.collection('users').doc(user.uid).get()).data() || {}).fullName || ''; } catch (e) {}
    name = name || user.displayName || '';
    if (!name) return note('Please add your full name in <a href="profile.html">My profile</a>, then open this page again.');
    const id = 'QOA-' + Math.random().toString(36).slice(2, 7).toUpperCase() + Date.now().toString(36).toUpperCase();
    const rec = { uid: user.uid, name, courseId: cid, courseTitle: course.title, issued: new Date().toISOString() };
    await db.collection('certificates').doc(id).set(rec);
    await progRef.set({ certId: id }, { merge: true });
    show({ id, ...rec }, false, course);
  } catch (e) { note('Could not create your certificate. Please try again, or contact us if it keeps happening.'); }
})();
</script>
</body>
</html>
